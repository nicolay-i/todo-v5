name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: self-hosted
    permissions:
      contents: read
    
    name: Test with SQLite

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Copy env example
        run: cp .env.local.example .env

      - name: Set development mode
        run: pnpm mode:dev

      - name: Setup environment variables
        run: |
          echo "DATABASE_URL=file:./test.db" >> $GITHUB_ENV

      - name: Sync database schema
        run: pnpm db:push

      - name: Run linter
        run: pnpm check

      - name: Build application
        run: pnpm build

